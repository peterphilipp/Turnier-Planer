name: Build & Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: machdasturnier

jobs:
  # Qualitäts-Gate: läuft VOR dem Build. Schlägt es fehl, wird kein Image
  # gebaut und gepusht (build-and-push hat `needs: test`).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # Ab setup-node@v5 wird bei erkanntem Paketmanager automatisch
          # gecacht. Hier bewusst aus: das Repo hat drei package.json
          # (root/backend/frontend), npm ci laeuft gezielt pro Verzeichnis.
          package-manager-cache: false

      # --- Backend ---
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: backend
        # In CI wird auf einem frischen DB-Dump gearbeitet. Alte Migrations
        # (ad-hoc SQL) sind nicht als gültige Chain von empty → schema.
        # Daher: prisma db push statt migrate deploy für CI.
        env:
          DATABASE_URL: "file:./prisma/data/ci.db"
        run: npx prisma db push --accept-data-loss

      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run backend tests
        working-directory: backend
        # Dummy-Werte: die Unit-Tests sprechen keine DB an, aber der
        # Prisma-Client und config/jwt.ts erwarten gesetzte Variablen.
        env:
          DATABASE_URL: "file:./prisma/data/ci.db"
          JWT_SECRET: "ci-only-dummy-secret-not-used-for-anything"
        run: npm test

      # --- Frontend ---
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          # Erzeugte Image-Tags:
          #   type=semver  -> die reine Versionsnummer, z. B. 1.8.0 (ohne "v")
          #   type=ref     -> Branch-Name bei manuellem workflow_dispatch
          #   type=raw     -> zusätzlich "latest", damit ein Rollout per :latest
          #                   verlässlich das neueste Release zieht.
          # "latest" bewusst NUR bei Versions-Tags (refs/tags/v*): ein manueller
          # workflow_dispatch auf einem Branch würde "latest" sonst mit einem
          # Nicht-Release-Build überschreiben, ohne dass es auffällt.
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
